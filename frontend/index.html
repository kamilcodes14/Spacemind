  :root {

    --user-border: rgba(217, 123, 42, 0.4);
 
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  * { box-sizing: border-box; }
 
  html, body {
    height: 100%;

  /* ---------- background: simple, static ---------- */
 
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(130, 166, 255, 0.08), transparent 60%),
      var(--void);

  .stars, .stars::after {
    position: absolute;
    inset: -10%;
    content: '';
    background-image:
      radial-gradient(1.6px 1.6px at 8% 22%, #fff, transparent 60%),
      radial-gradient(1.2px 1.2px at 18% 68%, #fff, transparent 60%),
      radial-gradient(1.8px 1.8px at 32% 12%, #fff, transparent 60%),
      radial-gradient(1.1px 1.1px at 46% 82%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 61% 38%, #fff, transparent 60%),
      radial-gradient(1.1px 1.1px at 74% 66%, #fff, transparent 60%),
      radial-gradient(1.6px 1.6px at 85% 20%, #fff, transparent 60%),
      radial-gradient(1.2px 1.2px at 93% 54%, #fff, transparent 60%),
      radial-gradient(1.3px 1.3px at 5% 90%, #fff, transparent 60%),
      radial-gradient(1.5px 1.5px at 55% 6%, #fff, transparent 60%);
    background-repeat: repeat;
    background-size: 340px 340px;
    opacity: 0.5;
    animation: twinkle 6s ease-in-out infinite;
  }
  .stars::after {
    background-size: 520px 520px;
    background-position: 90px 140px;
    opacity: 0.25;

  @keyframes twinkle {

  .stage.thinking {

  /* ---------- full-screen boot splash ---------- */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;

  #splash svg {
    width: 64px;
    height: 64px;

    transform-origin: 50% 50%;

  #splash.hidden {
    opacity: 0;
    pointer-events: none;

  @media (prefers-reduced-motion: reduce) {
    #splash svg { animation: none; }

  .bubble {
    min-width: 0;
    background: linear-gradient(180deg, rgba(12,14,20,0.5), rgba(12,14,20,0.32));

    border-radius: 4px 16px 16px 16px;
    padding: 13px 16px;
    backdrop-filter: blur(10px);
  }
 
  .pending { color: var(--text-muted); font-style: italic; font-size: 14px; }
  .pending .ellipsis::after {
    content: '';
    animation: ellipsis 1.4s infinite;
  }
  @keyframes ellipsis {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
 
  .answer { white-space: pre-wrap; font-size: 14.5px; }

<div id="splash">
  <video class="logo-vid splash-logo" src="logo.mp4" poster="logo.png" autoplay muted loop playsinline></video>
</div>
 
<div class="stage" id="stage" aria-hidden="true">
  <canvas id="space-canvas"></canvas>
</div>
 
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <h3>SpaceMind</h3>
  <button class="d-btn d-new" id="newResearch" type="button">＋ New Research</button>
  <div class="d-label">Recent</div>
  <div id="recentList"></div>
  <div class="d-foot">
    <button class="d-btn" id="dLibrary" type="button">Library</button>
    <button class="d-btn" id="dPaths" type="button">Learning paths</button>
  </div>
</aside>
 
<div class="app">
 
  <header class="topbar">
    <button id="menuBtn" type="button" aria-label="Menu">☰</button>
    <div class="brand">
      <video class="logo-vid brand-mark" src="logo.mp4" poster="logo.png" autoplay muted loop playsinline></video>
      <div>
        <h1>SpaceMind</h1>
        <p class="tagline">Grounded answers from papers — and the live web when needed</p>
      </div>
    </div>
    <div class="toolbar-right">
      <div class="depth-toggle" id="webToggle">
        <button type="button" data-web="auto" class="active">Auto</button>
        <button type="button" data-web="always">Web</button>

</div>
 
<script>
  const DEFAULT_API_BASE = location.hostname === 'localhost' ? 'http://localhost:8000' : (location.hostname.endsWith('onrender.com') ? location.origin : 'https://spacemind-sin9.onrender.com');
 
  function getSessionId() {
    let id = localStorage.getItem('spacemind_session_id');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
      localStorage.setItem('spacemind_session_id', id);
    }
    return id;
  }
 
  const state = {
    apiBase: localStorage.getItem('spacemind_api_base') || DEFAULT_API_BASE,
    sessionId: getSessionId(),
    depth: localStorage.getItem('spacemind_depth') || 'technical',
    webMode: localStorage.getItem('spacemind_web_mode') || 'auto', // 'auto' | 'always'
  };
 
  const el = {
    stage: document.getElementById('stage'),
    statusBtn: document.getElementById('statusBtn'),
    statusDot: document.getElementById('statusDot'),
    statusText: document.getElementById('statusText'),
    settingsPop: document.getElementById('settingsPop'),
    apiBaseInput: document.getElementById('apiBaseInput'),
    apiSaveBtn: document.getElementById('apiSaveBtn'),
    askForm: document.getElementById('askForm'),
    questionInput: document.getElementById('questionInput'),
    askBtn: document.getElementById('askBtn'),
    log: document.getElementById('log'),
    emptyState: document.getElementById('emptyState'),
    starters: document.getElementById('starters'),
    depthToggle: document.getElementById('depthToggle'),
    webToggle: document.getElementById('webToggle'),
    pathsBtn: document.getElementById('pathsBtn'),
    pathsOverlay: document.getElementById('pathsOverlay'),
    pathsList: document.getElementById('pathsList'),
    pathsClose: document.getElementById('pathsClose'),
    libraryBtn: document.getElementById('libraryBtn'),
    libraryOverlay: document.getElementById('libraryOverlay'),
    libraryList: document.getElementById('libraryList'),
    libraryIntro: document.getElementById('libraryIntro'),
    libraryClose: document.getElementById('libraryClose'),
  };
 
  function renderApiHint() {
    el.apiBaseInput.value = state.apiBase;
  }
 
  function setStatus(mode, label) {
    el.statusDot.className = 'dot ' + mode;
    el.statusText.textContent = label;
  }
 
  async function checkHealth() {
    setStatus('checking', 'checking');
    try {
      const res = await fetch(state.apiBase + '/health');
      if (!res.ok) throw new Error('bad status');
      setStatus('online', 'connected');
    } catch {
      setStatus('offline', 'not reachable');
    }
  }
 
  el.statusBtn.addEventListener('click', () => el.settingsPop.classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if (!el.settingsPop.contains(e.target) && e.target !== el.statusBtn && !el.statusBtn.contains(e.target)) {
      el.settingsPop.classList.remove('open');
    }
  });
 
  el.apiSaveBtn.addEventListener('click', () => {
    const v = el.apiBaseInput.value.trim().replace(/\/$/, '');
    if (!v) return;
    state.apiBase = v;
    localStorage.setItem('spacemind_api_base', v);
    renderApiHint();
    el.settingsPop.classList.remove('open');
    checkHealth();
  });
 
  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
 
  // Matches the API's citation schema: { source_file, origin, snippet }
  // Only allow normal web links, and make the value safe inside an HTML attribute.
  function safeUrl(u) {
    if (!u || !/^https?:\/\//i.test(u)) return '';
    return escapeHtml(u).replace(/"/g, '&quot;');
  }
 
  function renderSources(citations) {
    if (!citations || citations.length === 0) return '';
    const chips = citations.map((c, i) => `
      <button class="chip" type="button" data-idx="${i}">
        <span class="origin">[${i + 1}] ${escapeHtml(c.origin)}</span>
        <span class="title">${escapeHtml(c.source_file)}</span>
      </button>
    `).join('');
    const snippets = citations.map((c, i) => {
      const link = safeUrl(c.url);
      const openLink = link
        ? `<br><a class="paper-link" href="${link}" target="_blank" rel="noopener noreferrer">Open paper ↗</a>`
        : '';
      return `<div class="snippet" data-idx="${i}">${escapeHtml(c.snippet)}${openLink}</div>`;
    }).join('');
    return `<div class="sources"><p class="sources-label">Sources</p><div class="chips">${chips}</div>${snippets}</div>`;
  }
 
  function wireSourceChips(container) {
    container.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const idx = chip.getAttribute('data-idx');
        const snippet = container.querySelector(`.snippet[data-idx="${idx}"]`);
        if (snippet) snippet.classList.toggle('open');
      });
    });
  }
 
  function renderFollowUps(questions) {
    if (!questions || questions.length === 0) return '';
    const chips = questions.map((q) => `
      <button class="followup-chip" type="button">${escapeHtml(q)}</button>
    `).join('');
    return `<div class="followups">${chips}</div>`;
  }
 
  function wireFollowUps(container) {
    container.querySelectorAll('.followup-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        el.questionInput.value = chip.textContent;
        submitQuestion();
      });
    });
  }
 
  function renderShareButton(shareId) {
    if (!shareId) return '';
    return `
      <div class="bubble-actions">
        <button class="share-btn" type="button" data-share-id="${shareId}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
            <line x1="8.6" y1="10.6" x2="15.4" y2="6.4"></line><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"></line>
          </svg>
          Share
        </button>
      </div>
    `;
  }
 
  function wireShareButton(container) {
    const btn = container.querySelector('.share-btn');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const url = `${location.origin}${location.pathname}?share=${btn.dataset.shareId}`;
      try {
        await navigator.clipboard.writeText(url);
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      } catch {
        prompt('Copy this link:', url);
      }
    });
  }
 
  async function ask(question) {
    el.emptyState.style.display = 'none';
    el.stage.classList.add('thinking');
 
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.innerHTML = `
      <div class="msg user">${escapeHtml(question)}</div>
      <div class="msg assistant">
        <div class="avatar spinning">
          <svg viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="ringGradSpin" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="var(--gold)"/>
                <stop offset="50%" stop-color="var(--flare)"/>
                <stop offset="100%" stop-color="var(--amber)"/>
              </linearGradient>
            </defs>
            <path d="M4 50 L36 50" stroke="var(--amber)" stroke-width="6" stroke-linecap="round"/>
            <path d="M64 50 L96 50" stroke="var(--amber)" stroke-width="6" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="24" stroke="url(#ringGradSpin)" stroke-width="9" fill="none"/>
            <circle cx="50" cy="50" r="13" fill="var(--void)"/>
          </svg>
        </div>
        <div class="bubble">
          <div class="pending"><span class="ellipsis">Reading the papers</span></div>
        </div>
      </div>
    `;
    el.log.appendChild(entry);
    entry.scrollIntoView({ behavior: 'smooth', block: 'end' });
 
    const assistantMsg = entry.querySelector('.msg.assistant');
    const bubble = entry.querySelector('.bubble');
 
    try {
      const res = await fetch(state.apiBase + '/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question,
          top_k: 5,
          depth: state.depth,
          session_id: state.sessionId,
          use_web: state.webMode === 'always' ? true : (state.webMode === 'off' ? false : null),
        }),
      });
 
      if (res.status === 503) {
        // Surface the real backend message (missing index vs. missing/misconfigured
        // API key vs. something else) instead of always guessing "no papers".
        const body = await res.json().catch(() => ({}));
        const detail = body.detail || 'The backend reported it is not ready yet.';
        bubble.innerHTML = `<div class="error">${escapeHtml(detail)}</div>`;
        return;
      }
      if (res.status === 429) {
        bubble.innerHTML = '<div class="error">Rate limit reached — try again in a bit.</div>';
        return;
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed (${res.status})`);
      }
 
      const data = await res.json();
      saveRecent(question, data);
      if (!data.confident) {
        assistantMsg.classList.add('low-confidence');
      }
      const webBadge = data.used_web
        ? '<div style="color:var(--text-faint); font-size:11px; margin-bottom:8px;">🌐 sourced from a live web search</div>'
        : '';
      bubble.innerHTML =
        webBadge +
        `<div class="answer">${escapeHtml(data.answer)}</div>` +
        renderSources(data.citations) +
        renderFollowUps(data.follow_up_questions) +
        (data.confident ? renderShareButton(data.share_id) : '');
      wireSourceChips(bubble);
      wireFollowUps(bubble);
      wireShareButton(bubble);
    } catch (err) {
      bubble.innerHTML = `<div class="error">Can't reach ${escapeHtml(state.apiBase)}. Check that the API is running, then try again.</div>`;
    } finally {
      el.stage.classList.remove('thinking');
      const avatarEl = assistantMsg.querySelector('.avatar');
      if (avatarEl) {
        avatarEl.classList.remove('spinning');
        avatarEl.innerHTML = '';
      }
    }
  }
 
  function submitQuestion() {
    const q = el.questionInput.value.trim();
    if (!q) return;
    el.questionInput.value = '';
    el.questionInput.style.height = 'auto';
    el.askBtn.disabled = true;
    ask(q).finally(() => { el.askBtn.disabled = false; el.questionInput.focus(); });
  }
 
  el.askForm.addEventListener('submit', (e) => {
    e.preventDefault();
    submitQuestion();
  });
 
  el.questionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitQuestion();
    }
  });
 
  el.questionInput.addEventListener('input', () => {
    el.questionInput.style.height = 'auto';
    el.questionInput.style.height = Math.min(el.questionInput.scrollHeight, 160) + 'px';
  });
 
  el.starters.querySelectorAll('.starter').forEach((btn) => {
    btn.addEventListener('click', () => {
      el.questionInput.value = btn.textContent;
      submitQuestion();
    });
  });
 
  // ---------- depth toggle ----------
 
  function renderDepthToggle() {
    el.depthToggle.querySelectorAll('button').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.depth === state.depth);
    });
  }
  el.depthToggle.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.depth = btn.dataset.depth;
      localStorage.setItem('spacemind_depth', state.depth);
      renderDepthToggle();
    });
  });
  renderDepthToggle();
 
  // ---------- web toggle ----------
 
  function renderWebToggle() {
    el.webToggle.querySelectorAll('button').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.web === state.webMode);
    });
  }
  el.webToggle.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.webMode = btn.dataset.web;
      localStorage.setItem('spacemind_web_mode', state.webMode);
      renderWebToggle();
    });
  });
  renderWebToggle();
 
  // ---------- learning paths ----------
 
  async function loadLearningPaths() {
    el.pathsList.innerHTML = '<p style="color:var(--text-faint); font-size:13px;">Loading…</p>';
    try {
      const res = await fetch(state.apiBase + '/learning-paths');
      if (!res.ok) throw new Error('failed');
      const paths = await res.json();
      if (!paths.length) {
        el.pathsList.innerHTML = '<p style="color:var(--text-faint); font-size:13px;">No learning paths available.</p>';
        return;
      }
      el.pathsList.innerHTML = paths.map((p) => `
        <div class="path-card">
          <h3>${escapeHtml(p.title)}</h3>
          <p>${escapeHtml(p.description)}</p>
          ${(p.starter_questions || []).map((q) => `<button class="followup-chip" type="button">${escapeHtml(q)}</button>`).join('')}
        </div>
      `).join('');
      el.pathsList.querySelectorAll('.followup-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          el.pathsOverlay.classList.remove('open');
          el.questionInput.value = chip.textContent;
          submitQuestion();
        });
      });
    } catch {
      el.pathsList.innerHTML = '<p style="color:var(--text-faint); font-size:13px;">Could not load learning paths. Check the API connection.</p>';
    }
  }
 
  el.pathsBtn.addEventListener('click', () => {
    el.pathsOverlay.classList.add('open');
    loadLearningPaths();
  });
  el.pathsClose.addEventListener('click', () => el.pathsOverlay.classList.remove('open'));
  el.pathsOverlay.addEventListener('click', (e) => {
    if (e.target === el.pathsOverlay) el.pathsOverlay.classList.remove('open');
  });
 
  // ---------- paper library ----------
 
  async function loadLibrary() {
    el.libraryList.innerHTML = '<p style="color:var(--text-faint); font-size:13px;">Loading… (the first time can take a few seconds)</p>';
    try {
      const res = await fetch(state.apiBase + '/library');
      if (!res.ok) throw new Error('failed');
      const papers = await res.json();
      if (!papers.length) {
        el.libraryList.innerHTML = '<p style="color:var(--text-faint); font-size:13px;">No papers indexed yet.</p>';
        return;
      }
      el.libraryIntro.textContent = `${papers.length} papers SpaceMind can answer from.`;
      el.libraryList.innerHTML = papers.map((p) => {
        const name = escapeHtml(p.title || p.doc_id);
        const link = safeUrl(p.url);
        const title = link
          ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${name}</a>`
          : `<span>${name}</span>`;
        return `<div class="lib-item">${title}<span class="lib-meta">${escapeHtml(p.origin)} · ${escapeHtml(p.doc_id)}</span></div>`;
      }).join('');
    } catch {
      el.libraryList.innerHTML = '<p style="color:var(--text-faint); font-size:13px;">Could not load the library. Check the API connection.</p>';
    }
  }
 
  el.libraryBtn.addEventListener('click', () => {
    el.libraryOverlay.classList.add('open');
    loadLibrary();
  });
  el.libraryClose.addEventListener('click', () => el.libraryOverlay.classList.remove('open'));
  el.libraryOverlay.addEventListener('click', (e) => {
    if (e.target === el.libraryOverlay) el.libraryOverlay.classList.remove('open');
  });
 
  // ---------- shared-answer links ----------
 
  async function loadSharedAnswer(shareId) {
    try {
      const res = await fetch(state.apiBase + '/share/' + shareId);
      if (!res.ok) return;
      const data = await res.json();
 
      el.emptyState.style.display = 'none';
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <div class="msg user">${escapeHtml(data.question)}</div>
        <div class="msg assistant">
          <div class="avatar"></div>
          <div class="bubble">
            <div class="answer">${escapeHtml(data.answer)}</div>
            ${renderSources(data.citations)}
            ${renderFollowUps(data.follow_up_questions)}
          </div>
        </div>
      `;
      el.log.appendChild(entry);
      wireSourceChips(entry);
      wireFollowUps(entry);
    } catch {
      // Shared link couldn't load — fail silently, the composer still works.
    }
  }
 
  const sharedId = new URLSearchParams(location.search).get('share');
  if (sharedId) loadSharedAnswer(sharedId);
 
  // ---------- 3D space background (Three.js) ----------
  (() => {
    if (typeof THREE === 'undefined') return; // offline: page still works with plain dark bg
    // --- THREE.JS SCENE SETUP ---
    const canvas = document.getElementById('space-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010105, 0.0035);
 
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0);
 
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
 
    // Lighting
    const ambientLight = new THREE.AmbientLight(0x222233, 0.7);
    scene.add(ambientLight);
 
    const sunLight = new THREE.DirectionalLight(0xfff5ea, 2.5);
    sunLight.position.set(50, 40, -30);
    scene.add(sunLight);
 
    const fillLight = new THREE.DirectionalLight(0x0088ff, 0.8);
    fillLight.position.set(-40, -20, 20);
    scene.add(fillLight);
 
    // --- PROCEDURAL CANVAS TEXTURE GENERATORS ---
    
    // 1. Organic Rock Texture (Asteroid Surface)
    function generateRockTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
 
      ctx.fillStyle = '#38383e';
      ctx.fillRect(0, 0, 512, 512);
 
      // Noise
      const imgData = ctx.getImageData(0, 0, 512, 512);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 50;
        d[i] = Math.min(255, Math.max(0, d[i] + n));
        d[i+1] = Math.min(255, Math.max(0, d[i+1] + n));
        d[i+2] = Math.min(255, Math.max(0, d[i+2] + n));
      }
      ctx.putImageData(imgData, 0, 0);
 
      // Craters
      for (let i = 0; i < 40; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const r = 4 + Math.random() * 25;
        const grad = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
        grad.addColorStop(0, '#151518');
        grad.addColorStop(0.7, '#484852');
        grad.addColorStop(1, '#38383e');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
 
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }
 
    // 2. Gas Giant Planet Surface Texture
    function generateGasGiantTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 512;
      const ctx = cv.getContext('2d');
 
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#0c1a2b');
      grad.addColorStop(0.2, '#1e385c');
      grad.addColorStop(0.4, '#3b5e8c');
      grad.addColorStop(0.6, '#244168');
      grad.addColorStop(0.8, '#4a6d9c');
      grad.addColorStop(1.0, '#122238');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);
 
      // Cloud Band Ribbons
      for (let y = 0; y < 512; y += 2) {
        const wave = Math.sin(y * 0.03) * 20;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.08})`;
        ctx.fillRect(0, y + wave, 1024, 2);
      }
 
      // Great Vortex Oval
      ctx.fillStyle = 'rgba(120, 190, 255, 0.3)';
      ctx.beginPath();
      ctx.ellipse(350, 260, 90, 45, 0.1, 0, Math.PI * 2);
      ctx.fill();
 
      return new THREE.CanvasTexture(cv);
    }
 
    const rockTex = generateRockTexture();
    const planetTex = generateGasGiantTexture();
 
    // --- REALISTIC SMOOTH ASTEROID CREATION ---
    function createSmoothAsteroid(radius = 1.5) {
      // High detail icosahedron to avoid sharp crystal faces
      const geometry = new THREE.IcosahedronGeometry(radius, 4);
      const posAttr = geometry.attributes.position;
 
      // Multi-octave trigonometric noise for smooth craters & organic deform
      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const y = posAttr.getY(i);
        const z = posAttr.getZ(i);
 
        const n1 = Math.sin(x * 1.2) * Math.cos(y * 1.2) * Math.sin(z * 1.2) * 0.3;
        const n2 = (Math.sin(x * 3.5) + Math.cos(y * 3.5) + Math.sin(z * 3.5)) * 0.08;
        const factor = 1 + n1 + n2;
 
        posAttr.setXYZ(i, x * factor, y * factor, z * factor);
      }
 
      geometry.computeVertexNormals();
 
      const material = new THREE.MeshStandardMaterial({
        map: rockTex,
        bumpMap: rockTex,
        bumpScale: 0.25,
        roughness: 0.9,
        metalness: 0.1,
        flatShading: false // Smooth organic look, no sharp crystals!
      });
 
      return new THREE.Mesh(geometry, material);
    }
 
    // Object pool for endless asteroid streaming
    const ASTEROID_COUNT = 24;
    const asteroids = [];
 
    for (let i = 0; i < ASTEROID_COUNT; i++) {
      const scale = 1.0 + Math.random() * 2.5;
      const mesh = createSmoothAsteroid(scale);
      
      // Spawn spread in front of camera (-Z)
      mesh.position.set(
        (Math.random() - 0.5) * 80,
        (Math.random() - 0.5) * 50,
        -50 - Math.random() * 300
      );
 
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      
      const rotSpeed = [
        (Math.random() - 0.5) * 0.015,
        (Math.random() - 0.5) * 0.015,
        (Math.random() - 0.5) * 0.015
      ];
 
      scene.add(mesh);
      asteroids.push({ mesh, rotSpeed, radius: scale });
    }
 
    // --- 3D METALLIC UFO SPACECRAFT ---
    function buildUFO() {
      const ufoGroup = new THREE.Group();
 
      // Shiny metallic saucer body
      const bodyGeo = new THREE.CylinderGeometry(3.5, 1.2, 0.8, 32);
      const metalMat = new THREE.MeshStandardMaterial({
        color: 0x99aacc,
        metalness: 0.95,
        roughness: 0.15
      });
      const bodyMesh = new THREE.Mesh(bodyGeo, metalMat);
      ufoGroup.add(bodyMesh);
 
      // Glass Cockpit Dome
      const domeGeo = new THREE.SphereGeometry(1.6, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const domeMat = new THREE.MeshPhysicalMaterial({
        color: 0x00f0ff,
        transmission: 0.8,
        opacity: 0.9,
        transparent: true,
        roughness: 0.1
      });
      const domeMesh = new THREE.Mesh(domeGeo, domeMat);
      domeMesh.position.y = 0.35;
      ufoGroup.add(domeMesh);
 
      // Glowing Neon Energy Ring
      const ringGeo = new THREE.TorusGeometry(3.6, 0.12, 16, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI / 2;
      ufoGroup.add(ringMesh);
 
      // Bottom Thruster Glow Point
      const lightGeo = new THREE.CylinderGeometry(0.8, 1.2, 0.2, 16);
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
      const lightMesh = new THREE.Mesh(lightGeo, lightMat);
      lightMesh.position.y = -0.45;
      ufoGroup.add(lightMesh);
 
      ufoGroup.scale.set(0.7, 0.7, 0.7);
      ufoGroup.position.set(200, 200, 200); // Initial off-screen hiding position
      scene.add(ufoGroup);
 
      return {
        group: ufoGroup,
        active: false,
        time: 0,
        startX: 0, startY: 0, startZ: -180,
        targetX: 0, targetY: 0,
        speed: 0.8
      };
    }
 
    const ufoData = buildUFO();
 
    // Trigger UFO Encounters Periodically
    function triggerUFOEncounter() {
      if (ufoData.active) return;
      ufoData.active = true;
      ufoData.time = 0;
      ufoData.startX = (Math.random() - 0.5) * 60;
      ufoData.startY = (Math.random() - 0.5) * 30;
      ufoData.startZ = -220;
 
      ufoData.group.position.set(ufoData.startX, ufoData.startY, ufoData.startZ);
    }
 
    // --- BACKGROUND DEEP SPACE OBJECTS ---
    const planetGroup = new THREE.Group();
    planetGroup.position.set(45, -15, -280);
    scene.add(planetGroup);
 
    // Planet
    const planetGeo = new THREE.SphereGeometry(16, 64, 64);
    const planetMat = new THREE.MeshStandardMaterial({ map: planetTex, roughness: 0.8 });
    const planetMesh = new THREE.Mesh(planetGeo, planetMat);
    planetGroup.add(planetMesh);
 
    // Planet Rings
    const ringGeo = new THREE.RingGeometry(22, 34, 64);
    ringGeo.rotateX(Math.PI / 2.2);
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0x88aabb,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.6
    });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    planetGroup.add(ringMesh);
 
    // --- CONTINUOUS STARFIELD & DUST ---
    const STAR_COUNT = 3000;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(STAR_COUNT * 3);
    const starCol = new Float32Array(STAR_COUNT * 3);
 
    for (let i = 0; i < STAR_COUNT; i++) {
      starPos[i * 3]     = (Math.random() - 0.5) * 350;
      starPos[i * 3 + 1] = (Math.random() - 0.5) * 350;
      starPos[i * 3 + 2] = -Math.random() * 400;
 
      const shade = 0.7 + Math.random() * 0.3;
      starCol[i * 3]     = shade;
      starCol[i * 3 + 1] = shade + 0.1;
      starCol[i * 3 + 2] = 1.0;
    }
 
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
 
    const starMat = new THREE.PointsMaterial({
      size: 0.45,
      vertexColors: true,
      transparent: true,
      opacity: 0.9
    });
 
    const starParticles = new THREE.Points(starGeo, starMat);
    scene.add(starParticles);
 
    // --- BLACK HOLE PLACEMENT (deep background, far behind the asteroid/star field) ---
    // BH_SCALE sets how big it looks; BH_X / BH_Y move it on screen.
    const BH_DIST = 650, BH_SCALE = 26, BH_X = -190, BH_Y = 70;
    const blackHoleWorld = new THREE.Group();
    blackHoleWorld.position.set(BH_X, BH_Y, -BH_DIST);
    blackHoleWorld.scale.setScalar(BH_SCALE);
    blackHoleWorld.rotation.x = THREE.MathUtils.degToRad(9); // tilt so the disk is seen from slightly above
    scene.add(blackHoleWorld);
    const bhClock = new THREE.Clock();
 
    // --- Relativistic Realistic Black Hole ---
    // This uses multiple objects and a complex shader pass to simulate lensing
 
    const blackHoleGroup = new THREE.Group();
    blackHoleGroup.position.set(0, 0, 0); // Position at center for this example
    blackHoleWorld.add(blackHoleGroup);
 
    // 1. The Core (Event Horizon) - Perfect dark sphere
    const coreGeo = new THREE.SphereGeometry(3.0, 64, 64);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    blackHoleGroup.add(coreMesh);
 
    // 2. Lensed halo: glowing arc around the horizon (faces the camera, sits behind the core)
    const haloMat = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 } },
      vertexShader: `
        varying vec2 vP;
        void main() {
          vP = position.xy;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vP;
        uniform float time;
        void main() {
          float r = length(vP);
          float d = max(r - 3.0, 0.0);
          float glow = exp(-d * 1.6) * 1.4;
          // brighter above and below, like light bent over the top and bottom of the disk
          float topBottom = 0.45 + 0.55 * abs(vP.y) / max(r, 0.001);
          float pulse = 0.95 + 0.05 * sin(time * 0.8);
          vec3 col = mix(vec3(1.0, 0.45, 0.1), vec3(1.0, 0.85, 0.5), exp(-d * 3.0));
          gl_FragColor = vec4(col * glow * topBottom * pulse, glow * topBottom);
        }
      `,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });
    const haloMesh = new THREE.Mesh(new THREE.RingGeometry(2.0, 9, 128, 1), haloMat);
    haloMesh.position.z = -3.5;
    blackHoleGroup.add(haloMesh);
 
    // 3. Accretion disk: flat ring seen at a shallow angle
    function createDiskTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 1024, 256);
      for (let i = 0; i < 2500; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 256;
        const len = 20 + Math.random() * 120;
        const alpha = Math.random() * 0.35 + 0.1;
        const c = [`rgba(255,120,30,${alpha})`, `rgba(255,190,100,${alpha})`, `rgba(255,235,200,${alpha})`];
        ctx.fillStyle = c[Math.floor(Math.random() * 3)];
        ctx.fillRect(x, y, len, 1 + Math.random() * 2);
      }
      const t = new THREE.CanvasTexture(cv);
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.RepeatWrapping;
      return t;
    }
    const diskTex = createDiskTexture();
 
    const diskMat = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 }, diskTexture: { value: diskTex } },
      vertexShader: `
        varying vec2 vUv;
        varying float vDoppler;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          // approaching side (left) is brighter, receding side (right) is dimmer
          vDoppler = 1.0 + 0.9 * clamp(-wp.x / 10.0, -1.0, 1.0);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float time;
        uniform sampler2D diskTexture;
        varying vec2 vUv;
        varying float vDoppler;
        void main() {
          // inner gas orbits faster than outer gas
          float speed = 0.06 / (0.25 + vUv.y);
          vec4 tex = texture2D(diskTexture, vec2(vUv.x * 3.0 + time * speed, vUv.y));
          float heat = 1.0 - vUv.y;
          vec3 col = mix(vec3(1.0, 0.4, 0.08), vec3(1.0, 0.9, 0.65), heat * heat);
          float intensity = (0.35 + tex.r * 1.6) * vDoppler * (0.4 + heat * 1.4);
          float edge = smoothstep(0.0, 0.08, vUv.y) * (1.0 - smoothstep(0.7, 1.0, vUv.y));
          gl_FragColor = vec4(col * intensity, edge);
        }
      `,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide
    });
 
    const DISK_IN = 3.6, DISK_OUT = 11;
    const diskGeo = new THREE.RingGeometry(DISK_IN, DISK_OUT, 160, 12);
    const dp = diskGeo.attributes.position, du = diskGeo.attributes.uv;
    for (let i = 0; i < dp.count; i++) {
      const x = dp.getX(i), y = dp.getY(i);
      du.setXY(i, Math.atan2(y, x) / (Math.PI * 2) + 0.5, (Math.hypot(x, y) - DISK_IN) / (DISK_OUT - DISK_IN));
    }
    diskGeo.rotateX(-Math.PI / 2);
    const diskMesh = new THREE.Mesh(diskGeo, diskMat);
    blackHoleGroup.rotation.z = THREE.MathUtils.degToRad(-12);
    blackHoleGroup.position.x = 2;
    blackHoleGroup.add(diskMesh);
 
    // 4. Foreground Planetesimal Object (Tiny dark sphere on the left disk edge)
    const bhPlanetGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const bhPlanetMat = new THREE.MeshStandardMaterial({
        color: 0x050505, 
        roughness: 0.9, 
        metalness: 0.1
    });
    const bhPlanetMesh = new THREE.Mesh(bhPlanetGeo, bhPlanetMat);
    // Position on the front-left edge of the disk
    bhPlanetMesh.position.set(-6, 0.1, 4); 
    blackHoleGroup.add(bhPlanetMesh);
 
    
    // Parallax mouse / touch control
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
 
    // Flight speed (1.0 = cruise). Change to 0.35 for drift or 3.2 for warp.
    let speedMode = 1.0;
 
    // --- MAIN CONTINUOUS MOTION ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      speedMode += ((document.getElementById('stage').classList.contains('thinking') ? 3 : 1) - speedMode) * 0.04;
 
      const currentZSpeed = 1.2 * speedMode;
 
      // 1. Camera Mouse Parallax
      camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
      camera.position.y += (-mouseY * 4 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, -50);
 
      // 2. Endless Asteroid Streaming Engine
      asteroids.forEach(a => {
        a.mesh.position.z += currentZSpeed;
        a.mesh.rotation.x += a.rotSpeed[0];
        a.mesh.rotation.y += a.rotSpeed[1];
 
        // Recycle asteroid once it flies past camera (+Z)
        if (a.mesh.position.z > 20) {
          a.mesh.position.z = -250 - Math.random() * 100;
          a.mesh.position.x = (Math.random() - 0.5) * 90;
          a.mesh.position.y = (Math.random() - 0.5) * 60;
        }
      });
 
      // 3. Continuous Starfield Motion
      const positions = starParticles.geometry.attributes.position.array;
      for (let i = 0; i < STAR_COUNT; i++) {
        positions[i * 3 + 2] += currentZSpeed * 2.2;
        if (positions[i * 3 + 2] > 20) {
          positions[i * 3 + 2] = -350;
        }
      }
      starParticles.geometry.attributes.position.needsUpdate = true;
 
      // 4. Background Planet Drift
      planetGroup.position.z += currentZSpeed * 0.08;
      planetMesh.rotation.y += 0.0008;
      if (planetGroup.position.z > 50) {
        planetGroup.position.z = -320;
      }
 
      // 5. UFO Encounter AI Logic
      if (ufoData.active) {
        ufoData.time += 0.015 * speedMode;
        
        // Curved swooping path across view
        ufoData.group.position.z += currentZSpeed * 1.4;
        ufoData.group.position.x = ufoData.startX + Math.sin(ufoData.time * 2) * 35;
        ufoData.group.position.y = ufoData.startY + Math.cos(ufoData.time * 1.5) * 15;
        ufoData.group.rotation.y += 0.03;
 
        if (ufoData.group.position.z > 30) {
          ufoData.active = false;
          ufoData.group.position.set(200, 200, 200); // Hide
        }
      } else {
        // Random chance to spawn UFO encounter
        if (Math.random() < 0.001) {
          triggerUFOEncounter();
        }
      }
 
      // Black hole shader animation
      const bhTime = bhClock.getElapsedTime();
      diskMat.uniforms.time.value = bhTime;
      haloMat.uniforms.time.value = bhTime;
 
      renderer.render(scene, camera);
    }
 
    // Start Engine
    animate();
 
    // Responsive Canvas Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  
  })();
 
  // logo plays faster while SpaceMind is answering
  (() => {
    const vids = document.querySelectorAll('video.logo-vid');
    new MutationObserver(() => {
      const r = el.stage.classList.contains('thinking') ? 2.5 : 1;
      vids.forEach((v) => { v.playbackRate = r; });
    }).observe(el.stage, { attributes: true, attributeFilter: ['class'] });
  })();
 
  // ---------- quiet UI: drawer, history, research menu ----------
  (() => {
    const $ = (id) => document.getElementById(id);
    const drawer = $('drawer'), scrim = $('scrim'), pop = $('researchPop'), chip = $('researchChip');
    const KEY = 'spacemind_recent';
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
 
    // research mode + answer style live in one small menu above the composer
    const l1 = Object.assign(document.createElement('label'), { textContent: 'Research mode' });
    const l2 = Object.assign(document.createElement('label'), { textContent: 'Answer style' });
    pop.append(l1, el.webToggle, l2, el.depthToggle);
    const names = { auto: 'Auto', always: 'Web', off: 'Papers' };
    const syncChip = () => { chip.textContent = 'Research: ' + (names[state.webMode] || 'Auto') + ' ▾'; };
    el.webToggle.querySelectorAll('button').forEach((b) => b.addEventListener('click', syncChip));
    syncChip();
    chip.addEventListener('click', (e) => { e.stopPropagation(); pop.classList.toggle('open'); });
    document.addEventListener('click', (e) => { if (!pop.contains(e.target)) pop.classList.remove('open'); });
 
    const setDrawer = (open) => { drawer.classList.toggle('open', open); scrim.classList.toggle('open', open); };
    $('menuBtn').addEventListener('click', () => { renderRecent(); setDrawer(true); });
    scrim.addEventListener('click', () => setDrawer(false));
    addEventListener('keydown', (e) => { if (e.key === 'Escape') { setDrawer(false); pop.classList.remove('open'); } });
 
    function resetView() {
      el.log.innerHTML = '';
      el.emptyState.style.display = '';
      history.replaceState(null, '', location.pathname);
    }
    $('newResearch').addEventListener('click', () => {
      state.sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
      localStorage.setItem('spacemind_session_id', state.sessionId);
      resetView(); setDrawer(false); el.questionInput.focus();
    });
    $('dLibrary').addEventListener('click', () => { setDrawer(false); el.libraryBtn.click(); });
    $('dPaths').addEventListener('click', () => { setDrawer(false); el.pathsBtn.click(); });
 
    window.saveRecent = (q, data) => {
      const list = load().filter((r) => r.q !== q);
      list.unshift({ q, id: data.share_id || '' });
      localStorage.setItem(KEY, JSON.stringify(list.slice(0, 30)));
    };
 
    function renderRecent() {
      const box = $('recentList');
      const list = load();
      box.innerHTML = list.length ? '' : '<div class="d-label">Your questions will appear here.</div>';
      list.forEach((r) => {
        const b = document.createElement('button');
        b.className = 'd-btn'; b.type = 'button'; b.textContent = r.q; b.title = r.q;
        b.addEventListener('click', () => {
          resetView(); setDrawer(false);
          if (r.id) loadSharedAnswer(r.id);
          else { el.questionInput.value = r.q; submitQuestion(); }
        });
        box.appendChild(b);
      });
    }
  })();
 
  const splashStart = Date.now();
  function hideSplash() {
    const splash = document.getElementById('splash');
    if (!splash) return;
    const minVisible = 600; // ms — so the spinner doesn't just flash on a fast local backend
    const wait = Math.max(0, minVisible - (Date.now() - splashStart));
    setTimeout(() => {
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 400);
    }, wait);
  }
 
  renderApiHint();
  checkHealth().then(hideSplash);
  setInterval(checkHealth, 20000);
</script>
</body>
</html>
