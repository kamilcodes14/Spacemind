name: Live astronomy model evaluation
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * 1"
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:live
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EVAL_EMAIL: ${{ secrets.EVAL_EMAIL }}
          EVAL_PASSWORD: ${{ secrets.EVAL_PASSWORD }}
          EVAL_BACKEND_REVISION: ${{ vars.EVAL_BACKEND_REVISION }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astronomy-evaluation
          path: |
            evals/latest-report.json
            evals/reports/*.json
