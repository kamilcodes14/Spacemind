name: Scheduled hosted corpus refresh
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect new abstracts
        run: python scripts/collect_hosted_corpus.py --abstracts-only --per-source 15
      - name: Import into hosted vector index
        run: python scripts/import_supabase_papers.py --jsonl data/processed/hosted-corpus.jsonl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          PAPER_IMPORT_TOKEN: ${{ secrets.PAPER_IMPORT_TOKEN }}
